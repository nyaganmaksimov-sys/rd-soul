<style>
#soul-header{--bg:#080808;--gold:#d5ad5b;--text:#f7f2e8;font-family:Arial,sans-serif;background:rgba(8,8,8,.94);color:var(--text);position:sticky;top:0;z-index:9999;border-bottom:1px solid rgba(213,173,91,.25);backdrop-filter:blur(12px)}#soul-header *{box-sizing:border-box}#soul-header .sh{max-width:1180px;margin:auto;padding:0 24px;height:76px;display:flex;align-items:center;justify-content:space-between}.sh-logo{font:300 28px/1 Arial;letter-spacing:5px}.sh-nav{display:flex;gap:28px;align-items:center}.sh-nav a{color:#d7d0c5;text-decoration:none;font-size:11px;letter-spacing:1.4px;text-transform:uppercase}.sh-nav a:hover{color:var(--gold)}.sh-btn{padding:12px 18px;border:1px solid var(--gold);color:var(--gold)!important}.sh-toggle{display:none}@media(max-width:760px){#soul-header .sh{height:64px}.sh-nav{display:none;position:absolute;top:64px;left:0;right:0;background:#090909;padding:28px 24px 35px;flex-direction:column;align-items:stretch;gap:0;border-bottom:1px solid #493a20}.sh-nav a{padding:16px 0;border-bottom:1px solid #211d18}.sh-nav a:last-child{border:1px solid var(--gold);text-align:center;margin-top:12px}.sh-toggle{display:block;color:var(--gold);font-size:25px;cursor:pointer}.sh-check{display:none}.sh-check:checked~.sh-nav{display:flex}}
