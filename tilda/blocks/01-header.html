<!-- SOUL / TILDA BLOCK 01 HEADER -->
<style>
#soul-header{--bg:#080808;--gold:#d5ad5b;--text:#f7f2e8;font-family:Arial,sans-serif;background:rgba(8,8,8,.94);color:var(--text);position:sticky;top:0;z-index:9999;border-bottom:1px solid rgba(213,173,91,.25);backdrop-filter:blur(12px);width:100%;overflow:visible}
#soul-header *{box-sizing:border-box}
#soul-header .sh{max-width:1180px;margin:auto;padding:0 24px;height:76px;display:flex;align-items:center;justify-content:space-between;position:relative}
.sh-logo{font:300 28px/1 Arial;letter-spacing:5px;color:#f7f2e8;text-decoration:none;white-space:nowrap}.sh-nav{display:flex;gap:28px;align-items:center}.sh-nav a{color:#d7d0c5;text-decoration:none;font-size:11px;letter-spacing:1.4px;text-transform:uppercase}.sh-nav a:hover{color:var(--gold)}.sh-btn{padding:12px 18px;border:1px solid var(--gold);color:var(--gold)!important}.sh-toggle{display:none}.sh-check{display:none}
@media(max-width:980px){.sh-nav{gap:16px}.sh-nav a{font-size:10px;letter-spacing:1px}.sh-btn{padding:10px 13px}}
@media(max-width:760px){#soul-header .sh{height:64px;padding:0 18px}.sh-nav{display:none;position:absolute;top:64px;left:0;right:0;width:100%;background:#090909;padding:20px 18px 24px;flex-direction:column;align-items:stretch;gap:0;border-bottom:1px solid #493a20;box-shadow:0 18px 40px rgba(0,0,0,.45)}.sh-nav a{padding:15px 0;border-bottom:1px solid #211d18;font-size:11px}.sh-nav a:last-child{border:1px solid var(--gold);text-align:center;margin-top:12px;padding:14px}.sh-toggle{display:block;color:var(--gold);font-size:25px;line-height:1;cursor:pointer;user-select:none}.sh-check:checked~.sh-nav{display:flex}.sh-logo{font-size:24px;letter-spacing:4px}}
@media(max-width:380px){#soul-header .sh{padding:0 14px}.sh-logo{font-size:22px;letter-spacing:3px}.sh-nav{padding-left:14px;padding-right:14px}}
</style>
<header id="soul-header"><div class="sh"><a class="sh-logo" href="https://soul-rd.ru/home/" aria-label="SOUL — официальный сайт">SOUL</a><input class="sh-check" id="soul-menu" type="checkbox" aria-label="Открыть меню"><label class="sh-toggle" for="soul-menu" aria-label="Открыть меню">☰</label><nav class="sh-nav" aria-label="Основная навигация"><a href="https://soul-rd.ru/home/">Ресторан SOUL</a><a href="https://soul-rd.ru/banketnyi-zal/">Банкетный зал</a><a href="https://soul-rd.ru/karaoke/">SHUM Karaoke</a><a href="https://soul-rd.ru/home/#gallery">Галерея</a><a href="https://soul-rd.ru/home/#contacts">Контакты</a><a class="sh-btn" href="https://soul-rd.ru/home/#booking">Забронировать</a></nav></div></header>
