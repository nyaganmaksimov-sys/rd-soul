<style>
#soul-hero{--gold:#d5ad5b;--gold2:#f0cf83;--text:#f7f2e8;background:#080808;color:var(--text);font-family:Arial,sans-serif}#soul-hero *{box-sizing:border-box}#soul-hero .wrap{max-width:1180px;margin:auto;padding:0 24px}.hero{min-height:calc(100vh - 76px);display:grid;grid-template-columns:.82fr 1.35fr;gap:44px;align-items:center;padding:70px 0;background:radial-gradient(circle at 75% 45%,#3b2a12 0,transparent 34%),linear-gradient(110deg,#050505,#0d0b08)}.hero-logo{font:300 58px/1 Arial;letter-spacing:7px}.hero-kicker{color:var(--gold);letter-spacing:5px;text-transform:uppercase;font-size:12px;margin:14px 0 52px}.hero h1{font:400 54px/1.08 Georgia,serif;margin:0 0 20px}.hero h1 span{color:var(--gold2)}.hero p{color:#d3cdc2;font-size:18px;line-height:1.6;max-width:500px}.hero-btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}.hero-btn{display:inline-block;padding:15px 24px;border:1px solid var(--gold);background:var(--gold);color:#100d08;text-decoration:none;text-transform:uppercase;letter-spacing:.8px;font-size:12px}.hero-btn.alt{background:transparent;color:var(--gold2)}.hero-img{height:610px;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent),url('https://raw.githubusercontent.com/nyaganmaksimov-sys/rd-soul/main/images/4B1A8318.jpg') center/cover;border:1px solid #6d5425;box-shadow:0 30px 90px #000}.hero-scroll{margin-top:40px;color:#857b6d;font-size:10px;letter-spacing:3px}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:45px 0 55px;min-height:auto}.hero-img{height:58vh;min-height:360px;grid-row:1}.hero-logo{font-size:44px}.hero h1{font-size:39px}.hero p{font-size:16px}.hero-btns{flex-direction:column}.hero-btn{text-align:center}.hero-scroll{display:none}}
</style>
