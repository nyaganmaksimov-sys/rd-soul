<!-- SOUL / TILDA BLOCK 02 HERO -->
<style>
#soul-hero{--gold:#d5ad5b;--gold2:#f0cf83;--text:#f7f2e8;background:#080808;color:var(--text);font-family:Arial,sans-serif;width:100%;overflow:hidden}#soul-hero *{box-sizing:border-box}#soul-hero .wrap{max-width:1180px;margin:auto;padding:0 24px;min-width:0}.hero{min-height:calc(100vh - 76px);display:grid;grid-template-columns:minmax(0,.82fr) minmax(0,1.35fr);gap:44px;align-items:center;padding:70px 0;background:radial-gradient(circle at 75% 45%,#3b2a12 0,transparent 34%),linear-gradient(110deg,#050505,#0d0b08)}.hero-logo{font:300 58px/1 Arial;letter-spacing:7px}.hero-kicker{color:var(--gold);letter-spacing:5px;text-transform:uppercase;font-size:12px;margin:14px 0 52px}.hero h1{font:400 54px/1.08 Georgia,serif;margin:0 0 20px}.hero h1 span{color:var(--gold2)}.hero p{color:#d3cdc2;font-size:18px;line-height:1.6;max-width:500px}.hero-btns{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}.hero-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:15px 24px;border:1px solid var(--gold);background:var(--gold);color:#100d08;text-decoration:none;text-transform:uppercase;letter-spacing:.8px;font-size:12px;text-align:center}.hero-btn.alt{background:transparent;color:var(--gold2)}.hero-img{width:100%;height:610px;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent),url('https://raw.githubusercontent.com/nyaganmaksimov-sys/rd-soul/main/images/4B1A8318.jpg') center/cover;border:1px solid #6d5425;box-shadow:0 30px 90px #000}.hero-scroll{margin-top:40px;color:#857b6d;font-size:10px;letter-spacing:3px}
@media(max-width:980px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding:55px 0}.hero-logo{font-size:48px}.hero-kicker{margin-bottom:35px}.hero h1{font-size:44px}.hero-img{height:520px}}
@media(max-width:700px){.hero{display:flex;flex-direction:column;align-items:stretch;gap:30px;min-height:0;padding:42px 0 55px}.hero>.wrap:first-child{order:1}.hero>.wrap:last-child{order:2}.hero-img{height:58vw;min-height:300px;max-height:430px}.hero-logo{font-size:42px;letter-spacing:5px}.hero-kicker{font-size:11px;letter-spacing:3px;margin:12px 0 28px}.hero h1{font-size:36px;line-height:1.1}.hero p{font-size:16px}.hero-btns{flex-direction:column;gap:10px;margin-top:26px}.hero-btn{width:100%;padding:14px 16px}.hero-scroll{display:none}.hero>.wrap{padding:0 18px}}
@media(max-width:420px){.hero{padding:34px 0 45px;gap:24px}.hero>.wrap{padding:0 15px}.hero-logo{font-size:38px}.hero h1{font-size:32px}.hero p{font-size:15px}.hero-img{height:300px;min-height:300px}}
</style>
<section id="top" class="hero"><div class="wrap"><div class="hero-logo">SOUL</div><div class="hero-kicker">Ресторанный дом</div><h1>ТРИ ФОРМАТА<br><span>ОДНА АТМОСФЕРА</span></h1><p>Ресторан, банкетный зал и караоке-lounge — для ужина, праздника, корпоратива или вечера с друзьями.</p><div class="hero-btns"><a class="hero-btn" href="#booking">Забронировать стол</a><a class="hero-btn alt" href="#banquets">Организовать мероприятие</a></div><div class="hero-scroll">SCROLL ↓</div></div><div class="wrap"><div class="hero-img"></div></div></section>
