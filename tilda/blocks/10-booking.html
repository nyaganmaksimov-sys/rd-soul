<style>

<section id="soul-booking"><div class="s-bk-wrap"><div class="s-bk-grid"><div><div class="s-bk-kicker">БРОНИРОВАНИЕ</div><h2 class="s-bk-title">ВАШ ВЕЧЕР<br>НАЧИНАЕТСЯ ЗДЕСЬ</h2><p class="s-bk-text">Оставьте заявку. Администратор свяжется с вами, уточнит детали и поможет выбрать подходящее пространство.</p></div><form class="s-bk-form" onsubmit="return false"><label class="s-bk-label">Имя<input class="s-bk-input" name="name" type="text" placeholder="Ваше имя"></label><label class="s-bk-label">Телефон<input class="s-bk-input" name="phone" type="tel" placeholder="+7 ___ ___-__-__"></label><label class="s-bk-label">Дата<input class="s-bk-input" name="date" type="date"></label><label class="s-bk-label">Гостей<input class="s-bk-input" name="guests" type="number" min="1" placeholder="Количество"></label><label class="s-bk-label s-bk-full">Формат<select class="s-bk-select" name="format"><option>Ресторан SOUL</option><option>Банкетный зал «Сиреневый»</option><option>SHUM</option></select></label><label class="s-bk-label s-bk-full">Комментарий<textarea class="s-bk-area" name="comment" placeholder="Расскажите о вашем мероприятии"></textarea></label><button class="s-bk-submit" type="submit">Отправить заявку</button><div class="s-bk-note">Для приёма заявок подключите к этому блоку форму Tilda или Webhook. Дизайн и адаптивность блока уже готовы.</div></form></div></div></section>
