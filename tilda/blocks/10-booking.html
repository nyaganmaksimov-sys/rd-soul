<!-- SOUL / TILDA BLOCK 10 BOOKING -->
<style>
#soul-booking{background:#171411;color:#f7f2e8;padding:90px 0;font-family:Arial,sans-serif;width:100%;overflow:hidden}#soul-booking *{box-sizing:border-box}#soul-booking .wrap{max-width:1000px;margin:auto;padding:0 24px}.bk-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:70px;align-items:start}.bk-kicker{color:#d5ad5b;font-size:11px;letter-spacing:3px}.bk-title{font:400 50px/1.05 Georgia,serif;margin:15px 0}.bk-text{color:#aaa296;line-height:1.7}.bk-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0}.bk-form label{font-size:10px;color:#aaa296;letter-spacing:1px;text-transform:uppercase;min-width:0}.bk-form input,.bk-form select,.bk-form textarea{display:block;width:100%;max-width:100%;margin-top:7px;padding:14px;background:#0d0c0b;border:1px solid #4a3c28;color:#f7f2e8;outline:0;border-radius:0;font:inherit}.bk-form textarea{min-height:100px;resize:vertical}.bk-full{grid-column:1/-1}.bk-submit{grid-column:1/-1;width:100%;padding:16px;border:1px solid #d5ad5b;background:#d5ad5b;color:#171411;text-transform:uppercase;letter-spacing:1px;cursor:pointer}.bk-note{grid-column:1/-1;color:#777066;font-size:11px;line-height:1.5}
@media(max-width:980px){#soul-booking{padding:75px 0}.bk-grid{gap:40px}.bk-title{font-size:44px}}
@media(max-width:700px){#soul-booking{padding:55px 0}.bk-grid{grid-template-columns:1fr;gap:30px}.bk-title{font-size:35px}.bk-form{grid-template-columns:1fr;gap:12px}.bk-full,.bk-submit,.bk-note{grid-column:auto}.bk-form input,.bk-form select,.bk-form textarea{font-size:16px;padding:13px}}
@media(max-width:420px){#soul-booking .wrap{padding:0 15px}.bk-title{font-size:30px}.bk-text{font-size:14px}}
</style>
<section id="booking"><div class="wrap"><div class="bk-grid"><div><div class="bk-kicker">БРОНИРОВАНИЕ</div><h2 class="bk-title">ВАШ ВЕЧЕР<br>НАЧИНАЕТСЯ ЗДЕСЬ</h2><p class="bk-text">Оставьте заявку. Администратор свяжется с вами, уточнит детали и поможет выбрать подходящее пространство.</p></div><form class="bk-form" action="https://forms.tilda.cc/" method="post"><label>Имя<input name="name" type="text" placeholder="Ваше имя" required></label><label>Телефон<input name="phone" type="tel" placeholder="+7 ___ ___-__-__" required></label><label>Дата<input name="date" type="date"></label><label>Гостей<input name="guests" type="number" min="1" placeholder="Количество"></label><label class="bk-full">Формат<select name="format"><option>Ресторан SOUL</option><option>Банкетный зал «Сиреневый»</option><option>SHUM</option></select></label><label class="bk-full">Комментарий<textarea name="comment" placeholder="Расскажите о вашем мероприятии"></textarea></label><button class="bk-submit" type="submit">Отправить заявку</button><div class="bk-note">В Tilda замените action формы на адрес формы Tilda или подключите Zero Block Form. Этот блок отвечает за дизайн и адаптивность.</div></form></div></div></section>
